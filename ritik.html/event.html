<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./event.css"
    <title> Event Registation</title>
</head>
<body>
    <div class="container">
        <h1>CodingClub</h1>
    <nav>
       <a href="#">Event |</a>
       
       <a href="#">Register</a>
    </nav>
    

     

     <h2>Upcoming Event</h2>
        
      <table class="table" border="05" width="500px" >
            <caption>Club Events</caption>
         <thead>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
         </thead>
         <tbody>
            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>
            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
            <tr>
                <td colspan="03">Total Event: 2</td>
            </tr>
         </tbody>
        </table>
    </main>
    
    
        <h2>Register</h2>
        <div class="container2">
            <label for="name">Name:</label>
            <input type="name" id="name"  placeholder="Enter Your Name" required>
        </div>
            <br><br>

            <label for="email">Email:</label>
             <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
          
             <br><br>

            <label for="password">Password:</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
           <br><br>

            <label for="Date of birth">Date of birth:</label>
              <input type="date" id="dob" name="date of birth" placeholder="dd/mm/yy" required
          <br><br><br>

            <label for="phone">Phone:</label>
              <input type="phone" id="phone" name="phone" placeholder="" required>
          <br><br>

            <label for="gender">Gender:</label>
              <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
              <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
          <br><br>

            <label for="interests">Interests:</label>
              <input type="radio" id="web" name="Interests" value="Web">
            <label for="Web">Web</label>
              <input type="radio" id="dsa" name="Interests" value="dsa">
            <label for="dsa">DSA</label>
          <br><br>

            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="BCA">BCA</option>
                <option value="B.TECH(cse)">B.TECH(cse)</option>
                <option value="MBA">MBA</option>
                <option value="BBA">BBA</option>
                <option value="LLB">LLB</option>
            </select>
            </div >
            <br><br>
            <div>
            <tr>
            <td><label for="join">Why do you want to join?</label></td>
            <br>
             <td><textarea id="message" name="message" rows="5" cols="30" placeholder="" required></textarea></td>
             </tr>
             </div>       
                 <br>
        
            <button class="submit">Register</button>
        

    
    
</body>
</html>
